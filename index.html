<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Everything, Then More</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070b;--fg:#e8e8f0;--accent:#5bff5b;--dim:#8a8aa0;--panel:rgba(10,10,16,.82)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Press Start 2P',ui-monospace,monospace;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#wrap{position:relative;aspect-ratio:16/9.9;width:min(100vw,calc(100vh*16/9.9))}
canvas#c{width:100%;height:90.9%;display:block;image-rendering:pixelated;background:#000}
#hud{position:absolute;inset:0;pointer-events:none}
#hud .tag{pointer-events:none}
.tag{position:absolute;font-size:clamp(7px,1.05vw,12px);letter-spacing:.5px;text-shadow:0 0 6px #000,0 0 2px #000;white-space:nowrap}
#era{left:2%;top:3.5%;color:var(--accent)}
#clock{right:2%;top:3.5%;color:var(--dim);text-align:right}
#lyric{left:5%;right:5%;bottom:14%;text-align:center;font-size:clamp(7px,1.15vw,13px);line-height:1.7;color:#cfd3dc;opacity:.85;text-shadow:0 0 14px #000,0 0 4px #000,0 2px 0 #000;white-space:normal;transition:opacity .2s}
#auto{left:2%;bottom:10.5%;color:var(--dim);font-size:clamp(6px,.85vw,10px)}
#help{right:2%;bottom:10.5%;color:var(--dim);font-size:clamp(6px,.85vw,10px);text-align:right}
#bar{position:absolute;left:0;right:0;bottom:0;height:9.1%;background:var(--panel);display:flex;align-items:center;gap:1.5%;padding:0 2%;box-sizing:border-box;pointer-events:auto}
button{font:inherit;font-size:clamp(6px,.85vw,10px);background:#15151f;color:var(--fg);border:1px solid #333;padding:.7em .9em;cursor:pointer;white-space:nowrap}
button:hover{border-color:#666}
button.on{border-color:var(--accent);color:var(--accent)}
#scrub{flex:1;position:relative;height:38%;background:#1b1b26;cursor:pointer;border:1px solid #2a2a38}
#prog{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2f6,#3cf);width:0;pointer-events:none}
.mark{position:absolute;top:0;bottom:0;width:1px;background:#666;pointer-events:none}
.mark span{position:absolute;top:-1.9em;left:3px;font-size:clamp(5px,.65vw,8px);color:var(--dim);white-space:nowrap}
#time{color:var(--dim);font-size:clamp(6px,.85vw,10px);min-width:5.5em;text-align:right}
</style>
</head>
<body>
<div id="stage"><div id="wrap">
<canvas id="c"></canvas>
<div id="hud">
  <div class="tag" id="era">1978 · ARCADE</div>
  <div class="tag" id="clock">BAR 1 · 1</div>
  <div class="tag" id="lyric"></div>
  <div class="tag" id="auto">AUTOPILOT ON · press any key to play</div>

    <button id="play">PAUSE</button>
    <button id="restart">RESTART</button>

    <div id="scrub"><div id="prog"></div></div>
    <div id="time">0:00</div>
  </div>
</div>
</div></div>
<script>
'use strict';
// ---------- core constants ----------
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function rngf(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=n=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const BPM=128,BEAT=60/BPM,BAR=BEAT*4,TOTAL=96*BAR;
const bar=n=>n*BAR;
const W=960,H=540;
const ERAS=[
 {name:'1978 · ARCADE',start:bar(0)},
 {name:'1991 · 16-BIT',start:bar(19)},
 {name:'1997 · 32-BIT',start:bar(37)},
 {name:'2016 · SANDBOX',start:bar(56)},
 {name:'NOW · AGENTS',start:bar(75)}];
const TRANS=BAR*1.5;
const eraAt=t=>{let e=0;for(let i=0;i<ERAS.length;i++)if(t>=ERAS[i].start)e=i;return e};
const transAt=t=>{for(let i=1;i<ERAS.length;i++){const s=ERAS[i].start;if(t>=s-TRANS&&t<s)return{from:i-1,to:i,p:(t-(s-TRANS))/TRANS}}return null};
const LYRICS=[[2,'One pixel, one life, one line to hold'],[4,'Green light on glass in a room gone cold'],[6,"Left, right, fire, that's all we knew"],[8,'A row of them falling, a little of me too'],[12,'But every wave came faster'],[14,'And every wave came new'],
[19,'Give me everything, then give me more'],[21,'Every screen I ever sat in front of'],[23,'Give me everything, then give me more'],[25,"I don't want the game, I want what it's made of"],
[27.5,"Now I've got legs and the ground's got springs"],[29.5,"Coins in the sky and the sky's got rings"],[31.5,"Jump on the beat, every block's a drum"],[33.5,"Wherever I land is where I'm from"],
[38,'Spin the world till it shows me a horizon'],[40,'Fog at the edge where the polygons quit'],[42,'Foot to the floor and the floor is a texture'],[44,'A thousand triangles chasing the light'],
[47,'Give me everything, then give me more'],[49,'Every screen I ever sat in front of'],[51,'Give me everything, then give me more'],[53,"I don't want the game, I want what it's made of"],
[57,'Now every brick I drop stays down'],[59,"I'm not just playing, I'm laying the town"],[61,'Shadows that bend and water that knows'],[63,'Whatever I picture is a place I can go'],
[66.5,"Wait, who's placing that?"],[68,"I didn't put that there"],[69.5,'I said what I wanted out loud'],[71,'And a hundred hands appeared'],
[75,'A hundred little hands and they all learned from mine'],[77,"Writing out a world while I'm still reading the line"],[79,"Spawn a sky, spawn a road, spawn a rule I don't know"],[81,"I'll play whatever you make me, just don't stop, go"],
[83,'Give me everything, then give me more'],[85,'Every game I ever played is in here'],[87,'Give me everything, then give me more'],[89,"Now the game is building a game, and it's building it for me"],
[94,'One pixel. One life.'],[95,'Press start.']];

// ---------- canvas ----------
const cv=$('#c'),dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext('2d');
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return{c,x,w,h}}
const lo1=mk(192,108),lo2=mk(320,180),lo3=mk(320,180);
function pix(x,pat,px,py,pal,s=1,flip=false){for(let r=0;r<pat.length;r++){const row=pat[r];for(let c=0;c<row.length;c++){const ch=row[flip?row.length-1-c:c];if(ch==='.')continue;x.fillStyle=typeof pal==='string'?pal:pal[ch];x.fillRect(px+c*s,py+r*s,s,s)}}}
const scanPat=(()=>{const p=mk(1,3);p.x.fillStyle='rgba(0,0,0,.45)';p.x.fillRect(0,2,1,1);return ctx.createPattern(p.c,'repeat')})();
function scan(a){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.fillStyle=scanPat;ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.75)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore()}
function blit(lo){ctx.drawImage(lo.c,0,0,W,H)}

// ---------- input ----------
const keys={};let fireEdge=false,jumpEdge=false,mv={x:0,y:0},lastInputReal=-1e9;
addEventListener('keydown',e=>{const k=e.key;if(k==='p'||k==='P'){togglePlay();return}if(k==='m'||k==='M'){toggleClick();return}if(k==='a'||k==='A'){cycleAuto();return}if(k==='l'||k==='L'){captions=!captions;lyricShown='';return}if(k>='1'&&k<='5'){seek(ERAS[+k-1].start);return}
 if(e.repeat){if(k===' ')e.preventDefault();return}keys[k]=true;
 if(k===' '){fireEdge=true;e.preventDefault()}if(k==='ArrowUp'||k==='w'||k==='W'){jumpEdge=true;mv.y-=1}if(k==='ArrowDown'||k==='s'||k==='S')mv.y+=1;if(k==='ArrowLeft'||k==='a'||k==='A')mv.x-=1;if(k==='ArrowRight'||k==='d'||k==='D')mv.x+=1;
 if(k.startsWith('Arrow')||k===' '||'wasdWASD'.includes(k)){lastInputReal=performance.now();if(k.startsWith('Arrow'))e.preventDefault()}});
addEventListener('keyup',e=>{keys[e.key]=false});
function readInput(){return{left:!!(keys.ArrowLeft||keys.a||keys.A),right:!!(keys.ArrowRight||keys.d||keys.D),up:!!(keys.ArrowUp||keys.w||keys.W),down:!!(keys.ArrowDown||keys.s||keys.S),fire:fireEdge,jump:jumpEdge||fireEdge,upEdge:jumpEdge,mv:{x:mv.x,y:mv.y}}}

// ---------- audio (optional click track) ----------
let AC=null,master=null,noiseBuf=null,clickOn=false;
function ensureAC(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.45;master.connect(AC.destination)}if(AC.state==='suspended')AC.resume()}
function tone(freq,dur,type='square',vol=0.2,slide=0){if(!clickOn||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t0+dur);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);o.connect(g);g.connect(master);o.start();o.stop(t0+dur+0.02)}
function noise(dur,vol,hp){if(!clickOn||!AC)return;if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=AC.createGain(),t0=AC.currentTime;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);s.connect(f);f.connect(g);g.connect(master);s.start();s.stop(t0+dur+0.02)}
const kick=()=>tone(150,0.18,'sine',0.7,-120),snare=()=>{noise(0.12,0.3,1800);tone(200,0.1,'triangle',0.25,-80)},hat=o=>noise(o?0.09:0.03,0.16,7000),blip=(f,d=0.08,v=0.12)=>tone(f,d,'square',v);
function drums(era,b){if(!clickOn)return;const q=b%4;if(era===0)return;if(era===1){if(q===0||q===2)kick();if(q===1||q===3)snare()}else if(era===2){if(q===0)kick();if(q===2)snare()}else{kick();if(q===1||q===3)snare();if(era===4)blip([110,98,87,82][q],0.1,0.08)}}
</script>
<script>
// ---------- ERA 1: arcade ----------
const E1=(()=>{
const LW=192,LH=108,C='#5bff5b';
const INV=[['..X..X..','...XX...','..XXXX..','.X.XX.X.','XXXXXXXX','X.XXXX.X','X.X..X.X','...XX...'],
['...XX...','..XXXX..','.XXXXXX.','XX.XX.XX','XXXXXXXX','..X..X..','.X.XX.X.','X.X..X.X'],
['..XXXX..','.XXXXXX.','XXXXXXXX','XX.XX.XX','XXXXXXXX','...XX...','..X..X..','.X....X.']];
const SHIP=['....X....','...XXX...','.XXXXXXX.','XXXXXXXXX'];
const shatterT=bar(17);const S={};
function newWave(){S.alive=[];for(let r=0;r<4;r++)for(let c=0;c<8;c++)S.alive.push({r,c,on:true});S.ox=50;S.oy=12;S.dir=1}
function gridW(){let min=8,max=-1;for(const a of S.alive)if(a.on){min=Math.min(min,a.c);max=Math.max(max,a.c)}return{min,max}}
function step(b){S.frame^=1;const g=gridW();if(g.max<0)return;const left=S.ox+g.min*12,right=S.ox+g.max*12+8;
 if((S.dir>0&&right+3>LW-6)||(S.dir<0&&left-3<6)){S.dir*=-1;S.oy=Math.min(S.oy+4,52)}else S.ox+=S.dir*3;
 if(b%4===2){const bot={};for(const a of S.alive)if(a.on){if(!bot[a.c]||bot[a.c].r<a.r)bot[a.c]=a}const arr=Object.values(bot);if(arr.length){const a=arr[Math.floor(S.rng()*arr.length)];S.bombs.push({x:S.ox+a.c*12+4,y:S.oy+a.r*10+8})}}
 if(clickOn)blip([110,98,87,82][b%4],0.1,0.1)}
function shatter(){S.debris=[];const r=rngf(99);for(const a of S.alive){if(!a.on)continue;const x=S.ox+a.c*12,y=S.oy+a.r*10;for(let i=0;i<6;i++)S.debris.push({x:x+r()*8,y:y+r()*8,vx:(r()-.5)*40,vy:-r()*30,land:LH-4-Math.floor(r()*3)});a.on=false}S.bul=[];S.bombs=[]}
function init(t){S.ship={x:LW/2-4,y:LH-10,hit:0};S.bul=[];S.bombs=[];S.pops=[];S.words=[];S.score=0;S.debris=null;S.frame=0;S.cool=0;S.rng=rngf(7);newWave();
 const beats=Math.floor(Math.min(t,shatterT)/BEAT);for(let b=0;b<beats;b++)step(b);S.bombs=[];if(t>=shatterT)shatter()}
function onLine(words,t){if(t>=shatterT||t>=ERAS[1].start)return;S.words=S.words.filter(w=>w.on&&w.y<56);const gap=5,ws=words.map(w=>w.length*4),total=ws.reduce((a,b)=>a+b,0)+gap*(words.length-1);let x=Math.max(2,(LW-total)/2);words.forEach((w,i)=>{S.words.push({text:w,x,y:44,w:ws[i],on:true});x+=ws[i]+gap})}
const wsc=w=>lerp(1,1.5,clamp((w.y-44)/50,0,1));
function fire(){if(S.bul.length<2&&S.cool<=0){S.bul.push({x:S.ship.x+4,y:S.ship.y-2});S.cool=0.12;blip(880,0.05)}}
function onBeat(b,t){if(t<shatterT)step(b);else if(!S.debris)shatter()}
function on8th(n,t,auto){if(auto&&t<shatterT)fire()}
function update(dt,t,inp,auto){if(t>=ERAS[1].start)return;S.cool-=dt;const sh=S.ship;
 if(t<shatterT){let dx=0;if(auto){let tx=LW/2,best=1e9;const live=S.words.filter(w=>w.on);if(live.length){for(const w of live){const ax=w.x+w.w*wsc(w)/2;const d=Math.abs(ax-(sh.x+4))+(LH-w.y)*0.3;if(d<best){best=d;tx=ax}}}else for(const a of S.alive)if(a.on){const ax=S.ox+a.c*12+4;const d=Math.abs(ax-(sh.x+4));if(d<best){best=d;tx=ax}}dx=clamp((tx-4-sh.x)*5,-80,80)*dt}
  else{if(inp.left)dx=-70*dt;if(inp.right)dx=70*dt;if(inp.fire)fire()}sh.x=clamp(sh.x+dx,4,LW-13)}
 else{if(!S.debris)shatter();const tx=80/320*LW-4;sh.x=lerp(sh.x,tx,1-Math.pow(0.02,dt));sh.y=lerp(sh.y,LH-9,1-Math.pow(0.02,dt))}
 for(const b of S.bul){b.y-=140*dt;for(const a of S.alive){if(!a.on)continue;const ax=S.ox+a.c*12,ay=S.oy+a.r*10;if(b.x>=ax&&b.x<ax+8&&b.y>=ay&&b.y<ay+8){a.on=false;b.y=-10;S.score+=[30,20,20,10][a.r];for(let i=0;i<5;i++)S.pops.push({x:ax+4,y:ay+4,vx:(S.rng()-.5)*60,vy:(S.rng()-.5)*60,l:.3});break}}}
 for(const w of S.words){if(!w.on)continue;w.y+=13*dt;const sc=wsc(w);for(const b of S.bul){if(b.x>=w.x-1&&b.x<=w.x+w.w*sc+1&&b.y<=w.y+1&&b.y+4>=w.y-4*sc){w.on=false;b.y=-10;S.score+=50;blip(1760,0.08,0.1);for(let i=0;i<w.text.length*2;i++)S.pops.push({x:w.x+S.rng()*w.w*sc,y:w.y-S.rng()*5,vx:(S.rng()-.5)*80,vy:(S.rng()-.5)*80,l:.4});break}}}
 S.words=S.words.filter(w=>w.on&&w.y<LH-12);
 S.bul=S.bul.filter(b=>b.y>0);if(t<shatterT&&!S.alive.some(a=>a.on))newWave();
 for(const b of S.bombs){b.y+=60*dt;if(b.y>sh.y&&b.y<sh.y+4&&b.x>sh.x&&b.x<sh.x+9){sh.hit=0.3;b.y=999}}S.bombs=S.bombs.filter(b=>b.y<LH);
 for(const p of S.pops){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}S.pops=S.pops.filter(p=>p.l>0);
 if(S.debris)for(const d of S.debris){if(d.y<d.land){d.vy+=180*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;if(d.y>=d.land){d.y=d.land;d.vx=0}}}
 sh.hit=Math.max(0,sh.hit-dt)}
function draw(x,t){x.fillStyle='#020402';x.fillRect(0,0,LW,LH);const pulse=1-((t/BEAT)%1);x.globalAlpha=0.85+0.15*pulse;
 for(const a of S.alive)if(a.on)pix(x,INV[a.r===0?0:a.r<3?1:2],S.ox+a.c*12,S.oy+a.r*10,C,1,S.frame===1);
 x.globalAlpha=1;x.fillStyle=C;for(const b of S.bul)x.fillRect(b.x,b.y,1,4);for(const b of S.bombs)x.fillRect(b.x,b.y,1,3);
 for(const w of S.words){const sc=wsc(w);x.globalAlpha=w.y>LH-24?clamp((LH-12-w.y)/12,0,1):1;x.font=(4*sc).toFixed(1)+"px 'Press Start 2P',monospace";x.fillStyle=C;x.fillText(w.text,w.x,w.y)}x.globalAlpha=1;
 if(!(S.ship.hit>0&&Math.floor(t*30)%2))pix(x,SHIP,S.ship.x,S.ship.y,C);
 for(const p of S.pops)x.fillRect(p.x,p.y,1,1);
 if(S.debris)for(const d of S.debris)x.fillRect(d.x,d.y,1,1);
 x.fillRect(0,LH-2,LW,1);
 x.font="4px 'Press Start 2P',monospace";x.fillText('SCORE '+String(S.score).padStart(5,'0'),4,17);x.fillText('CREDIT 01',LW-40,17)}
return{init,onBeat,on8th,onLine,update,draw,SHIP}})();
</script>
<script>
// ---------- ERA 2: 16-bit platformer ----------
const E2=(()=>{
const LW=320,LH=180,B=16,SPEED=64/BEAT,PX=80,G=900,JV=-330;const start=ERAS[1].start;
const PAL={S:'#f3c7a0',B:'#2c5bd9',R:'#e03b3b',K:'#20202a',W:'#fff',Y:'#ffd23f'};
const DUDE=[['....RRRR....','...RRRRRR...','...SSSSSK...','...SKSSKS...','...SSSSSS...','....SSSS....','...BBBBBB...','..BBBBBBBB..','.SBBBBBBBBS.','.S.BBBBBB.S.','...BBBBBB...','...BB..BB...','...BB..BB...','..KK....KK..','..KK....KK..','............'],
['....RRRR....','...RRRRRR...','...SSSSSK...','...SKSSKS...','...SSSSSS...','....SSSS....','...BBBBBB...','..BBBBBBBB..','..SBBBBBBS..','...BBBBBB...','...BBBBBB...','..BB....BB..','.BB......BB.','KK........KK','............','............']];
const S={};
function gen(to){while(S.genX<to){const r=S.rng;
 if(S.plats.length===0){S.plats.push({x:-200,y:LH-48,w:200+PX+B*8,f:0});S.genX=S.plats[0].x+S.plats[0].w;S.lastTop=LH-48;continue}
 const w=(3+Math.floor(r()*6))*B;let top=clamp(S.lastTop+(Math.floor(r()*5)-2)*B,LH-112,LH-32);
 const dh=(S.lastTop-top)/B;const gap=(dh>=2?1:1+Math.floor(r()*3))*B;const x=S.genX+gap;S.plats.push({x,y:top,w,f:0});
 S.genX=x+w;S.lastTop=top}
 S.plats=S.plats.filter(p=>p.x+p.w>S.camX-400)}
function onLine(words,t){if(t<start-TRANS||t>=ERAS[2].start)return;let x=S.camX+LW-30;gen(x+700);S.coins=S.coins.filter(c=>c.got||c.x>S.camX-50);S.line=[];words.forEach((w,i)=>{const wd=w.length*6;const pl=S.plats.find(q=>x+wd/2>=q.x&&x+wd/2<=q.x+q.w);const top=pl?pl.y:S.lastTop;S.coins.push({x,y:top-30-(i%2)*14,w:wd,text:w,got:0});x+=wd+26})}
function init(t){S.rng=rngf(21);S.plats=[];S.coins=[];S.line=[];S.genX=0;S.lastTop=LH-48;S.score=0;S.coinsGot=0;S.camX=Math.max(0,t-start)*SPEED;gen(S.camX+LW+64);

  if(a.beam&&isFinite(a.beam.x)&&isFinite(a.beam.y)){const bx=a.beam.x-cam,by=a.beam.y;ctx.save();ctx.globalCompositeOperation='lighter';const cg=ctx.createLinearGradient(x,y,bx,by);cg.addColorStop(0,'rgba(255,255,255,0.3)');cg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=cg;ctx.globalAlpha=a.alpha*0.35;ctx.beginPath();ctx.moveTo(x,y+6);ctx.lineTo(bx-16,by);ctx.lineTo(bx+16,by);ctx.closePath();ctx.fill();ctx.restore();
   const mx=(x+bx)/2+(Math.random()-.5)*8,my=(y+by)/2+(Math.random()-.5)*8;neonLine(ctx,x,y+6,mx,my,a.col,1.5,0.6+0.4*Math.random());neonLine(ctx,mx,my,bx,by,a.col,1.5,0.6+0.4*Math.random());
   glow(ctx,bx,by,26,rgb,0.8);ctx.fillStyle='#fff';for(let i=0;i<4;i++)ctx.fillRect(bx+(Math.random()-.5)*20,by+(Math.random()-.5)*10,2,2);
   ctx.strokeStyle=a.col;ctx.lineWidth=1;ctx.globalAlpha=a.alpha*(0.4+0.6*pulse);ctx.beginPath();ctx.arc(bx,by,8+pulse*10,0,7);ctx.stroke();ctx.globalAlpha=a.alpha}
  const tilt=clamp(a.vx/1200,-0.45,0.45);ctx.translate(x,y);
  glow(ctx,0,0,44,rgb,0.4);glow(ctx,0,6,14,rgb,0.5+0.4*pulse);
  drawModel(ctx,agentModel(a.rgb,t,!!a.job),0,0,1.35,0.42,t*1.1+a.ph,-tilt*0.8,a.alpha);
  ctx.save();ctx.globalCompositeOperation='lighter';glow(ctx,0,-1,9,rgb,0.6+0.4*pulse);ctx.restore();
  if(a.job){const pr=clamp((t-a.job.start)/(a.job.end-a.job.start),0,1);ctx.strokeStyle=a.col;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,31,-Math.PI/2,-Math.PI/2+pr*Math.PI*2);ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.arc(0,0,31,0,7);ctx.stroke()}
  ctx.font="6px 'Press Start 2P',monospace";ctx.textAlign='center';ctx.fillStyle=a.col;ctx.fillText(WD.ROLE[a.role].n,0,-36);ctx.fillStyle=a.job?'#fff':'#8890b0';ctx.font="5px 'Press Start 2P',monospace";ctx.fillText(a.status||'',0,-28);ctx.textAlign='left';
  if(a.panel&&t-a.panel.t<2.2){const age=t-a.panel.t,fa=age>1.8?1-(age-1.8)/0.4:1;ctx.globalAlpha=a.alpha*fa;const px=clamp(x+30,4,W-192)-x,py=Math.max(4,y-70)-y;ctx.fillStyle='rgba(8,8,14,.88)';ctx.fillRect(px,py,186,42);ctx.strokeStyle=a.col;ctx.lineWidth=1;ctx.strokeRect(px,py,186,42);ctx.font="8px ui-monospace,monospace";let chars=Math.floor(age*46);for(let i=0;i<3;i++){const l=a.panel.lines[i],n=clamp(chars,0,l.length);ctx.fillStyle=i===2?'#fff':'#cfd8e3';ctx.fillText(l.slice(0,n)+(n<l.length?'_':''),px+6,py+13+i*12);chars-=l.length+4}}
  ctx.restore()}}
function drawHUD(ctx,t,pulse){if(t<s5||t>=bar(94.5))return;const a=clamp((t-s5)/0.6,0,1);ctx.save();ctx.globalAlpha=a;
 ctx.fillStyle='rgba(6,8,20,.7)';rrect(ctx,16,64,204,64,4);ctx.fill();neonLine(ctx,16,64,220,64,CYAN,1,0.8);ctx.font="9px 'Press Start 2P',monospace";ctx.fillStyle='#fff';ctx.fillText('SCORE '+String(S.score).padStart(6,'0'),26,84);ctx.fillStyle=YEL;ctx.fillText('WORDS '+S.words,26,100);ctx.fillStyle=S.combo>4?GRN:'#9aa';ctx.fillText('COMBO x'+S.combo,26,116);
 // build front meter
 const cam=camAt(t),front=Math.floor((cam+W)/CW)+2;ctx.font="6px 'Press Start 2P',monospace";ctx.fillStyle='#8890b0';ctx.fillText('BUILD FRONT  SECTOR '+String(Math.max(0,front)).padStart(2,'0')+'   '+S.agents.filter(x=>x.job).length+' AGENTS WORKING',26,140);
 const rx=W-236,ry=H-104-S.rules.length*14;ctx.fillStyle='rgba(6,8,20,.7)';rrect(ctx,rx,ry,220,26+S.rules.length*14,4);ctx.fill();neonLine(ctx,rx,ry,rx+220,ry,GRN,1,0.8);ctx.fillStyle='#9aa';ctx.font="7px 'Press Start 2P',monospace";ctx.fillText('RULES  (written by agents)',rx+10,ry+16);S.rules.forEach((ri,i)=>{const fresh=ri===S.ruleIdx&&t-S.ruleT<BAR*2;ctx.fillStyle=fresh?GRN:'#dfe';ctx.fillText((fresh?'> ':'  ')+RULES[ri][1],rx+10,ry+32+i*14)});
 ctx.font="7px 'Press Start 2P',monospace";S.log.forEach((l,i)=>{ctx.globalAlpha=a*(1-i*0.18);ctx.fillStyle=l.col;ctx.fillText(l.text,16,H-30-i*12)});ctx.globalAlpha=a;
 if(S.ruleIdx>=0&&t-S.ruleT<BAR*1.5){const q=t-S.ruleT,s=q<0.3?smooth(q/0.3):1,fo=q>BAR*1.2?1-(q-BAR*1.2)/(BAR*0.3):1;ctx.globalAlpha=a*s*fo;const r=RULES[S.ruleIdx];ctx.textAlign='center';ctx.font="16px 'Press Start 2P',monospace";ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(W/2-240,118,480,56);neonLine(ctx,W/2-240,118,W/2+240,118,GRN,1.5,1);ctx.fillStyle=GRN;ctx.fillText('NEW RULE: '+r[1],W/2,144);ctx.font="8px 'Press Start 2P',monospace";ctx.fillStyle='#fff';ctx.fillText(r[2],W/2,164);ctx.textAlign='left'}
 if(S.line.length){ctx.globalAlpha=a;ctx.textAlign='center';ctx.font="8px 'Press Start 2P',monospace";ctx.fillStyle=YEL;ctx.fillText(S.line.slice(-10).join(' '),W/2,H*0.86);ctx.textAlign='left'}
 ctx.restore()}
return{init,update,draw,onBeat,on8th,onLine,get S(){return S}}})();
</script>
<script>
// ---------- transport, compositing, HUD ----------
let songT=0,playing=true,lastNow=performance.now(),ended=false,cubeP=null,lastBeatT=-1,beatIdx=0;
function seek(t){lineIdx=-1;songT=clamp(t,0,TOTAL);E1.init(songT);E2.init(songT);E3.init(songT);WORLD.init(songT);E5.init(songT);cubeP=null;ended=false}
function togglePlay(){if(ended){seek(0);playing=true}else playing=!playing;$('#play').textContent=playing?'PAUSE':'PLAY'}
function toggleClick(){ensureAC();clickOn=!clickOn;$('#click').textContent='SOUND: '+(clickOn?'ON':'OFF');$('#click').classList.toggle('on',clickOn)}
const AUTO_MODES=['idle','on','off'],AUTO_LABEL={idle:'AUTOPILOT: WHEN IDLE',on:'AUTOPILOT: ON',off:'AUTOPILOT: OFF'};let autoMode='idle';
function cycleAuto(){autoMode=AUTO_MODES[(AUTO_MODES.indexOf(autoMode)+1)%3];$('#autoBtn').textContent=AUTO_LABEL[autoMode];$('#autoBtn').classList.toggle('on',autoMode==='on')}
function isAuto(now){return autoMode==='on'?true:autoMode==='off'?false:now-lastInputReal>2000}
$('#play').onclick=togglePlay;$('#restart').onclick=()=>{seek(0);playing=true;$('#play').textContent='PAUSE'};$('#click').onclick=toggleClick;$('#autoBtn').onclick=cycleAuto;
const scrub=$('#scrub');let drag=false;const sc=e=>{const r=scrub.getBoundingClientRect();seek(clamp((e.clientX-r.left)/r.width,0,1)*TOTAL)};
scrub.addEventListener('pointerdown',e=>{drag=true;sc(e)});addEventListener('pointermove',e=>{if(drag)sc(e)});addEventListener('pointerup',()=>drag=false);
for(const e of ERAS){const m=document.createElement('div');m.className='mark';m.style.left=(e.start/TOTAL*100)+'%';m.innerHTML='<span>'+e.name.split(' · ')[1]+'</span>';scrub.appendChild(m)}

function onBeat(b,t,auto){const e=eraAt(t);if(!(e===4&&t>=bar(94.5)))drums(e,b);E1.onBeat(b,t);WORLD.onBeat(b,t,auto);E5.onBeat(b,t,auto)}
function on8th(n,t,auto){const e=eraAt(t);if(clickOn&&e>=1&&!(e===4&&t>=bar(94.5)))hat(e===2&&n%2===1);E1.on8th(n,t,auto);WORLD.on8th(n,t,auto);E5.on8th(n,t,auto)}

function miniCube(x,y,s,col){const h=s*0.5;ctx.fillStyle=rgb(col,1);ctx.beginPath();ctx.moveTo(x,y-h);ctx.lineTo(x+s,y);ctx.lineTo(x,y+h);ctx.lineTo(x-s,y);ctx.fill();ctx.fillStyle=rgb(col,0.75);ctx.beginPath();ctx.moveTo(x+s,y);ctx.lineTo(x,y+h);ctx.lineTo(x,y+h+s);ctx.lineTo(x+s,y+s);ctx.fill();ctx.fillStyle=rgb(col,0.55);ctx.beginPath();ctx.moveTo(x-s,y);ctx.lineTo(x,y+h);ctx.lineTo(x,y+h+s);ctx.lineTo(x-s,y+s);ctx.fill()}
function cubes(p){if(!cubeP){cubeP=[];const r=rngf(5);for(let i=0;i<90;i++)cubeP.push({sx:W*0.5+(r()-.5)*W*0.5,sy:H*0.6+r()*H*0.4,tx:Math.floor(r()*WD.N),ty:Math.floor(r()*WD.N),d:r()*0.5,size:5+r()*7,col:[70+r()*90,90+r()*90,120+r()*100]})}
 for(const c of cubeP){const q=clamp((p-c.d)/0.5,0,1);if(q>=1)continue;const e=smooth(q);const tg=WD.iso(c.tx+0.5,c.ty+0.5,0);miniCube(lerp(c.sx,tg.x,e),lerp(c.sy,tg.y,e)-Math.sin(e*Math.PI)*90,c.size*(1-e*0.4),c.col)}}
function glitch(t){if(t-lastBeatT<0.07&&hash(beatIdx)>0.5){for(let i=0;i<3;i++){const y=Math.floor(hash(beatIdx*7+i)*H),h=10+hash(beatIdx*13+i)*40,dx=(hash(beatIdx*17+i)-0.5)*40;ctx.drawImage(cv,0,y*dpr,W*dpr,h*dpr,dx,y,W,h)}}}
function edge(x){const g=ctx.createLinearGradient(x-30,0,x+6,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,.9)');ctx.fillStyle=g;ctx.fillRect(x-30,0,36,H)}

function render(t,auto){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);const e=eraAt(t),tr=transAt(t);
 if(e===0){E1.draw(lo1.x,t);if(tr){E2.draw(lo2.x,t);blit(lo2);const ex=W*smooth(tr.p);ctx.save();ctx.beginPath();ctx.rect(ex,0,W-ex,H);ctx.clip();blit(lo1);ctx.restore();edge(ex);scan(1-tr.p*0.7)}else{blit(lo1);scan(1)}}
 else if(e===1){E2.draw(lo2.x,t);if(tr){E3.draw(lo3.x,t);blit(lo3);const p=smooth(tr.p);ctx.save();ctx.globalAlpha=1-p;const hy=H*0.5;ctx.translate(W/2,hy);ctx.scale(1+p*0.6,1-p*0.98);ctx.translate(-W/2,-hy);blit(lo2);ctx.restore();scan(0.3*(1-p))}else{blit(lo2);scan(0.3)}}
 else if(e===2){E3.draw(lo3.x,t);if(tr){WORLD.draw(ctx,t,auto);ctx.globalAlpha=Math.pow(1-tr.p,1.5);blit(lo3);ctx.globalAlpha=1;cubes(tr.p);scan(0.2*(1-tr.p))}else{blit(lo3);scan(0.2)}}
 else if(e===3){WORLD.draw(ctx,t,auto);if(tr){const p=smooth(tr.p);ctx.save();ctx.translate(W*(1-p),0);ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();E5.draw(ctx,t);ctx.restore();edge(W*(1-p))}}
 else{E5.draw(ctx,t);const q=clamp((t-ERAS[4].start)/(BAR*8),0,1);scan(0.22*q);glitch(t)}}

let lyricShown='',lineIdx=-1,captions=true;
function dispatchLine(i,t){const words=LYRICS[i][1].split(' ');E1.onLine(words,t);E2.onLine(words,t);E3.onLine(words,t);WORLD.onLine(words,t);E5.onLine(words,t)}
function hud(t,auto){const e=eraAt(t),tr=transAt(t);$('#era').textContent=tr?ERAS[tr.from].name+'  >  '+ERAS[tr.to].name:ERAS[e].name;
 $('#clock').textContent='BAR '+(Math.floor(t/BAR)+1)+' · '+(Math.floor((t%BAR)/BEAT)+1)+'  ·  '+BPM+' BPM';
 let line='',idx=-1;for(let i=0;i<LYRICS.length;i++){const s=bar(LYRICS[i][0]);if(t<s)break;idx=i;const nx=LYRICS[i+1]?bar(LYRICS[i+1][0]):1e9;if(t-s<Math.min(nx-s,bar(1.9)))line=LYRICS[i][1];else line=''}
 if(idx!==lineIdx){lineIdx=idx;if(idx>=0&&playing)dispatchLine(idx,t)}
 if(line!==lyricShown){lyricShown=line;const el=$('#lyric');el.style.opacity=line&&captions?1:0;if(line)el.textContent=line}
 $('#auto').textContent=autoMode==='on'?'AUTOPILOT · watching':autoMode==='off'?'MANUAL · you are playing':auto?'AUTOPILOT · press any key to play':'MANUAL · autopilot resumes after 2s idle';
 $('#time').textContent=Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+' / 3:00';$('#prog').style.width=(t/TOTAL*100)+'%'}

function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.05,(now-lastNow)/1000);lastNow=now;const inp=readInput();const auto=isAuto(now);
 if(playing){const prev=songT;songT=Math.min(TOTAL,songT+dt);const pb=Math.floor(prev/BEAT),cb=Math.floor(songT/BEAT);if(cb!==pb){beatIdx=cb;lastBeatT=songT;onBeat(cb,songT,auto)}
  const p8=Math.floor(prev/(BEAT/2)),c8=Math.floor(songT/(BEAT/2));if(c8!==p8)on8th(c8,songT,auto);
  if(songT>=TOTAL){playing=false;ended=true;$('#play').textContent='REPLAY'}
  E1.update(dt,songT,inp,auto);E2.update(dt,songT,inp,auto);E3.update(dt,songT,inp,auto);WORLD.update(dt,songT,inp,auto);E5.update(dt,songT,inp,auto)}
 render(songT,auto);hud(songT,auto);fireEdge=false;jumpEdge=false;mv.x=0;mv.y=0}
seek(0);requestAnimationFrame(frame);
</script>

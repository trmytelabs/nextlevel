<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Next Level</title>
<meta name="description" content="A three-minute playable music video: I leveled up with AI the way gaming did, just a lot faster. Ian Ginn for the Deputy's Maximalists.">
<meta name="theme-color" content="#07070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maximalist">
<meta property="og:title" content="Next Level">
<meta property="og:description" content="I leveled up with AI the way gaming did, just a lot faster. A playable music video by Ian Ginn for the Deputy's Maximalists.">
<meta property="og:type" content="website">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070b;--fg:#e8e8f0;--accent:#5bff5b;--dim:#8a8aa0;--panel:rgba(10,10,16,.82)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Press Start 2P',ui-monospace,monospace;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);box-sizing:border-box}
#wrap{position:relative;aspect-ratio:16/9.9;width:min(100%,calc((100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*16/9.9));width:min(100%,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*16/9.9))}
canvas#c{width:100%;height:90.9%;display:block;image-rendering:pixelated;background:#000}
#hud{position:absolute;inset:0;pointer-events:none}
#hud .tag{pointer-events:none}
.tag{position:absolute;font-size:clamp(7px,1.05vw,12px);letter-spacing:.5px;text-shadow:0 0 6px #000,0 0 2px #000;white-space:nowrap}
#era{display:none}
#clock{right:2%;top:3.5%;color:var(--dim);text-align:right}
#lyric{left:5%;right:5%;bottom:18.5%;text-align:center;font-size:clamp(7px,1.15vw,13px);line-height:1.7;color:#cfd3dc;opacity:.85;text-shadow:0 0 14px #000,0 0 4px #000,0 2px 0 #000;white-space:normal;transition:opacity .2s}
#auto{left:2%;bottom:13.5%;color:var(--dim);font-size:clamp(6px,.85vw,10px)}
#help{right:2%;bottom:10.5%;color:var(--dim);font-size:clamp(5px,.7vw,8px);text-align:right}
#bar{position:absolute;left:0;right:0;bottom:0;height:9.1%;background:var(--panel);display:flex;align-items:center;gap:1.5%;padding:0 2%;box-sizing:border-box;pointer-events:auto}
button{font:inherit;font-size:clamp(6px,.85vw,10px);background:#15151f;color:var(--fg);border:1px solid #333;padding:.7em .9em;cursor:pointer;white-space:nowrap}
button:hover{border-color:#666}
button.on{border-color:var(--accent);color:var(--accent)}
#scrub{flex:1;position:relative;height:38%;background:#1b1b26;cursor:pointer;border:1px solid #2a2a38}
#prog{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2f6,#3cf);width:0;pointer-events:none}
.mark{position:absolute;top:0;bottom:0;width:1px;background:#666;pointer-events:none}
.mark span{position:absolute;top:-1.9em;left:3px;font-size:clamp(5px,.65vw,8px);color:var(--dim);white-space:nowrap}
#time{color:var(--dim);font-size:clamp(6px,.85vw,10px);min-width:5.5em;text-align:right}
#bar{overflow:hidden}
/* title screen (startgl.ts): the canvas carries everything; the HUD tags hide until the game starts */
#endbtns{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:13%;z-index:3;gap:1.2em;pointer-events:auto}
body.endcard #endbtns{display:flex}
.eb{font:inherit;font-size:clamp(7px,1vw,12px);color:var(--accent);text-decoration:none;letter-spacing:.5px;padding:.9em 1.1em;border:1px solid rgba(91,255,91,.55);background:rgba(7,7,11,.72);cursor:pointer;text-shadow:0 0 6px #000;white-space:nowrap}
.eb:hover,.eb:focus-visible{border-color:var(--accent);background:rgba(91,255,91,.14);outline:none}
#notes{position:absolute;left:0;right:0;top:0;bottom:9.1%;z-index:5;background:rgba(5,4,12,.9);display:flex;align-items:center;justify-content:center;pointer-events:auto}
#notes[hidden]{display:none}
#notes .np{width:min(88%,860px);max-height:88%;display:flex;flex-direction:column;border:1px solid #ff3fb4;background:#0b0818;box-shadow:0 0 28px rgba(255,63,180,.35),inset 0 0 0 1px rgba(63,240,255,.15)}
#notes .nh{display:flex;justify-content:space-between;align-items:center;gap:1em;padding:1em 1.2em;border-bottom:1px solid #2c2240}
#notes .nh b{color:#ffd23f;font-size:clamp(9px,1.4vw,16px);font-weight:normal;letter-spacing:1px;text-shadow:0 0 10px rgba(255,210,63,.5)}
#notesBody{overflow:auto;touch-action:pan-y;overscroll-behavior:contain;padding:1em 1.4em 1.4em;font-size:clamp(6px,.85vw,10px);line-height:2.1;color:#d8d4ea;-webkit-user-select:text;user-select:text}
#notesBody .sub{color:#8f86b0}
#notesBody h3{font:inherit;color:#3ff0ff;margin:1.5em 0 .4em;font-weight:normal;letter-spacing:1px}
#notesBody ul{margin:0;padding-left:1.5em}
#notesBody li::marker{color:#ff3fb4}
@media (pointer:coarse){.eb{font-size:clamp(8px,1.4vw,12px)}#notesBody{font-size:clamp(7px,1.25vw,11px)}}
/* side pads (touch screens): a thumb stick in the left gutter, the action button in the right. Landscape: beside the game. Portrait ("play small"): under it. */
#pads{display:none}
@media (pointer:coarse){
 #pads{display:block;position:fixed;inset:0;pointer-events:none;z-index:2}
 .pad{position:absolute;top:0;bottom:0;width:var(--pad);pointer-events:auto;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(91,255,91,.035),rgba(255,63,180,.035))}
 #padL{left:env(safe-area-inset-left,0px);border-right:1px solid rgba(91,255,91,.12)}
 #padR{right:env(safe-area-inset-right,0px);border-left:1px solid rgba(255,63,180,.14)}
 #padRing{position:absolute;width:92px;height:92px;margin:-46px 0 0 -46px;left:50%;top:50%;border-radius:50%;border:2px solid rgba(91,255,91,.45);box-shadow:0 0 14px rgba(91,255,91,.18) inset}
 #padKnob{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:rgba(91,255,91,.32);border:2px solid rgba(91,255,91,.8)}
 #padA{width:86px;height:86px;border-radius:50%;border:3px solid #ff3fb4;background:rgba(255,63,180,.16);color:#ffd9f0;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:1px;box-shadow:0 0 18px rgba(255,63,180,.35)}
 #padA.on{background:rgba(255,63,180,.5);transform:scale(.94)}
 #padL.on #padRing{border-color:#5bff5b}
 .pl{position:absolute;bottom:12%;left:4px;right:4px;text-align:center;font-size:7px;line-height:1.8;color:var(--dim);letter-spacing:.5px;white-space:pre-line}
 body.noA #padA{opacity:.25}
 body.aim #padA,body.aim #padRing{display:none}
 body.aim .pad{background:linear-gradient(180deg,rgba(63,240,255,.07),rgba(255,63,180,.06))}
 body.aim .pl{bottom:auto;color:#9ff6ff}
 body.start #pads{display:none}
 #help{display:none}
}
@media (pointer:coarse) and (orientation:landscape){#bar{gap:1%;padding:0 1.2%}#bar button{font-size:clamp(5px,1.05vw,8px);padding:.8em .5em}}
@media (pointer:coarse) and (orientation:landscape){
 :root{--pad:clamp(112px,15.5vw,172px)}
 #stage{padding-left:calc(var(--pad) + env(safe-area-inset-left,0px));padding-right:calc(var(--pad) + env(safe-area-inset-right,0px))}
 body.start #stage{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
}
@media (pointer:coarse) and (orientation:portrait){
 :root{--pad:50%}
 body.pok #stage{align-items:flex-start}
 .pad{top:calc(env(safe-area-inset-top,0px) + 100vw*9/16);bottom:var(--barH,110px)}
 #padL{left:0}#padR{right:0}
}
body.start #hud .tag{display:none}
body.start canvas#c{cursor:pointer}
body.e1 #lyric{bottom:26%}
body.endcard #auto,body.endcard #help{display:none}
body.e4 #lyric{left:3%;right:64%;bottom:30%;text-align:left}
#rotate{display:none;position:fixed;inset:0;z-index:9;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:1.6em;text-align:center;font-size:clamp(9px,3.2vw,14px);line-height:1.9;color:var(--fg);padding:24px;box-sizing:border-box}
#rotate .ph{width:34px;height:60px;border:3px solid var(--accent);border-radius:6px;animation:turn 1.8s ease-in-out infinite}
#rotate small{color:var(--dim);font-size:.7em}
@keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (pointer:coarse){body:not(.pok) #rotate{display:flex}}
@media (max-width:1000px){.mark span{display:none}}
@media (pointer:coarse){button{font-size:clamp(6px,1.2vw,9px);padding:.8em .6em}#time{display:none}#help{font-size:clamp(5px,.9vw,8px);left:42%;white-space:normal;line-height:1.6}#auto{font-size:clamp(6px,1vw,9px)}.tag{font-size:clamp(7px,1.3vw,12px)}#clock{font-size:clamp(6px,1vw,9px)}#lyric{font-size:clamp(8px,1.6vw,14px)}#scrub{height:60%}}
/* portrait "play small": the frame is only ~240px tall, so the control bar leaves the frame and becomes a thumb-sized fixed bar */
@media (orientation:portrait) and (pointer:coarse){#wrap{aspect-ratio:16/9}canvas#c{height:100%}#help{display:none}#bar{position:fixed;top:auto;bottom:env(safe-area-inset-bottom,0px);height:auto;flex-wrap:wrap;justify-content:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}button{font-size:9px;padding:1em .8em}#scrub{flex:1 1 100%;height:22px;order:9}}
</style>
</head>
<body>
<div id="rotate"><div class="ph"></div><div>TURN YOUR PHONE SIDEWAYS<br><small>it is a widescreen game</small></div><small>or tap here to play small</small></div>
<div id="pads"><div class="pad" id="padL"><div id="padRing"><div id="padKnob"></div></div><div class="pl" id="padLl">&lt; MOVE &gt;</div></div><div class="pad" id="padR"><div id="padA">FIRE</div><div class="pl" id="padRl">HOLD · RAPID FIRE</div></div></div>
<div id="stage"><div id="wrap">
<canvas id="c"></canvas>
<div id="endbtns"><a id="src" class="eb" href="https://github.com/trmytelabs/maximalist" target="_blank" rel="noopener">SOURCE CODE</a><button id="notesBtn" class="eb" type="button">PATCH NOTES</button></div>
<div id="notes" hidden role="dialog" aria-modal="true" aria-labelledby="notesT"><div class="np"><div class="nh"><b id="notesT">PATCH NOTES</b><button id="notesX" class="eb" type="button">CLOSE</button></div><div id="notesBody"></div></div></div>
<div id="hud">
  <div class="tag" id="era">1 · ARCADE</div>
  <div class="tag" id="clock">BAR 1 · 1</div>
  <div class="tag" id="lyric"></div>
  <div class="tag" id="auto">AUTOPILOT ON · press any key to play</div>
  <div class="tag" id="help">WASD / ARROWS MOVE · SPACE FIRE / JUMP · Q AUTOPILOT · M SOUND · L CAPTIONS · G FX · P PAUSE · 1-5 ERA</div>
  <div id="bar">
    <button id="play">PAUSE</button>
    <button id="restart">RESTART</button>
    <button id="click">SOUND: OFF</button>
    <button id="autoBtn">AUTOPILOT: WHEN IDLE</button>
    <button id="qBtn" title="G: graphics quality (reloads)">FX: HIGH</button>
    <div id="scrub"><div id="prog"></div></div>
    <div id="time">0:00</div>
  </div>
</div>
</div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>

name: Headless verification

on:
  push:
    branches: [main, scaffold-vite]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: [self-hosted, windows, maximalist]
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      # Git bash on Windows rewrites arguments like /maximalist/ into C:/Program Files/Git/maximalist/; turn that off
      MSYS_NO_PATHCONV: '1'
      MSYS2_ARG_CONV_EXCL: '*'
    steps:
      - uses: actions/checkout@v4
      - name: Put Git bash on the PATH (self-hosted Windows runner)
        shell: cmd
        run: echo C:\Program Files\Git\bin>>%GITHUB_PATH%
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vite build --base /maximalist/
      - name: Serve the build
        run: |
          powershell -NoProfile -Command "(Start-Process -PassThru -WindowStyle Hidden cmd -ArgumentList '/c npx vite preview --port 5174 --strictPort').Id" > preview.pid
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:5174/maximalist/ && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:5174/maximalist/
      - name: Controls + phone layout
        run: node tools/test/run.mjs --controls --from 0 --to 4 --tag ctl && node tools/test/run.mjs --mobile --from 0 --to 4 --tag mob
      - name: Full three-minute autopilot run
        run: node tools/test/run.mjs --tag full --chunk 2
      - name: Stop the preview server
        if: always()
        run: taskkill //PID $(cat preview.pid) //T //F > /dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            tools/test/report*.json
            tools/test/shots/
